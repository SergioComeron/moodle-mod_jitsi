name: Release to Moodle Plugins Directory

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v5.5.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Resolve release tag
        id: tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          TAG="${TAG//[[:space:]]/}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "::error::Tag '${TAG}' is not a release tag. Enter a tag such as v5.5.0."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Extract plugin metadata from version.php
        id: meta
        run: |
          PLUGIN_VERSION=$(grep -oP '(?<=\$plugin->version = )\d+' version.php)
          PLUGIN_RELEASE=$(grep -oP "(?<=\\\$plugin->release = ')[^']+" version.php)
          echo "plugin_version=$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "plugin_release=$PLUGIN_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Version: $PLUGIN_VERSION, Release: $PLUGIN_RELEASE"

      - name: Extract release notes from CHANGES.md
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Extrae el bloque del tag actual (entre el primer ## y el siguiente)
          NOTES=$(awk "/^## $TAG/{found=1; next} found && /^## v[0-9]/{exit} found{print}" CHANGES.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release $TAG"
          fi
          # Guardar en fichero para evitar problemas con caracteres especiales
          echo "$NOTES" > /tmp/release_notes.txt
          echo "Release notes extraídas para $TAG"
          cat /tmp/release_notes.txt

      - name: Create plugin ZIP
        run: |
          mkdir -p /tmp/zip_build/jitsi
          rsync -av --exclude='.git' --exclude='.github' --exclude='.gitignore' --exclude='.gitattributes' --exclude='.camp' --exclude='CLAUDE.md' . /tmp/zip_build/jitsi/
          cd /tmp/zip_build
          zip -r mod_jitsi.zip jitsi
          mv mod_jitsi.zip "$GITHUB_WORKSPACE/mod_jitsi.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: mod_jitsi.zip
          body_path: /tmp/release_notes.txt

      - name: Publish to Moodle Marketplace
        env:
          MKPL_TOKEN: ${{ secrets.MOODLE_MARKETPLACE_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [[ -z "${MKPL_TOKEN}" ]]; then
            echo "::error::Repository secret MOODLE_MARKETPLACE_TOKEN is empty."
            exit 1
          fi

          echo "Submitting mod_jitsi.zip for ${TAG} to Moodle Marketplace"

          HTTP_STATUS=$(curl -sS --retry 3 --retry-delay 2 \
            -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${MKPL_TOKEN}" \
            -F "file=@mod_jitsi.zip;type=application/zip" \
            -F "releaseNotes=</tmp/release_notes.txt" \
            --form-string "vcsRepositoryUrl=https://github.com/${GITHUB_REPOSITORY}" \
            --form-string "vcsTag=${TAG}" \
            "https://marketplace.moodle.com/api/plugins/mod_jitsi/versions")

          echo "Response HTTP status: ${HTTP_STATUS}"
          if jq . response.json >/dev/null 2>&1; then
            jq . response.json
          else
            cat response.json
          fi

          if [[ "${HTTP_STATUS}" != "201" ]]; then
            echo "::error::Moodle Marketplace rejected the version (HTTP ${HTTP_STATUS})."
            if jq -e '.violations' response.json >/dev/null 2>&1; then
              echo "Validation violations:"
              jq '.violations' response.json
            fi
            exit 1
          fi

          echo "Submitted version $(jq -r '.version' response.json), status $(jq -r '.status' response.json)"
